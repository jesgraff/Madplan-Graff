<!DOCTYPE html>

<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madplan – familien Graff</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–g800: #1a3a2a;
–g700: #245235;
–g600: #2d6a4f;
–g500: #40916c;
–g400: #52b788;
–g300: #74c69d;
–g200: #95d5b2;
–g100: #d8f3dc;
–g050: #f0faf2;
–cream: #faf8f3;
–white: #ffffff;
–text: #1a2e22;
–muted: #5a7a65;
–shadow-sm: 0 1px 4px rgba(15,36,25,0.08);
–shadow-md: 0 4px 20px rgba(15,36,25,0.12);
–shadow-lg: 0 12px 40px rgba(15,36,25,0.18);
–radius: 16px;
–radius-sm: 10px;
}

html { scroll-behavior: smooth; }

body {
font-family: ‘DM Sans’, sans-serif;
background: var(–cream);
color: var(–text);
min-height: 100vh;
overflow-x: hidden;
}

/* ── HEADER ── */
.header {
background: linear-gradient(135deg, #1a3a2a 0%, #245235 60%, #2d6a4f 100%);
padding: 0 32px;
position: relative;
overflow: hidden;
box-shadow: 0 12px 40px rgba(15,36,25,0.18);
}
.header::before {
content: ‘’;
position: absolute; top: -80px; right: -80px;
width: 280px; height: 280px;
background: radial-gradient(circle, rgba(82,183,136,0.15) 0%, transparent 70%);
border-radius: 50%; pointer-events: none;
}
.header::after {
content: ‘’;
position: absolute; bottom: -60px; left: 20%;
width: 200px; height: 200px;
background: radial-gradient(circle, rgba(149,213,178,0.1) 0%, transparent 70%);
border-radius: 50%; pointer-events: none;
}
.header-inner {
max-width: 1240px; margin: 0 auto;
display: flex; align-items: center; justify-content: space-between;
padding: 24px 0; position: relative; z-index: 1; gap: 16px;
}
.site-title {
font-family: ‘Playfair Display’, serif;
font-size: clamp(1.3rem, 3vw, 2rem);
color: #ffffff; line-height: 1.15;
}
.site-title em { color: #95d5b2; font-style: italic; }
.week-meta { text-align: center; flex-shrink: 0; }
.week-num {
font-family: ‘Playfair Display’, serif;
font-size: 1rem; color: #95d5b2;
font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
}
.week-range { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 3px; }
.nav-btn {
background: rgba(255,255,255,0.1);
border: 1.5px solid rgba(255,255,255,0.2);
border-radius: 10px; color: #ffffff; padding: 10px 20px;
font-family: ‘DM Sans’, sans-serif; font-size: 0.85rem; font-weight: 500;
cursor: pointer; display: flex; align-items: center; gap: 8px;
transition: background 0.2s, transform 0.15s;
white-space: nowrap; flex-shrink: 0;
}
.nav-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.02); }
.nav-btn:active { transform: scale(0.98); }
.leaf-deco { position: absolute; pointer-events: none; opacity: 0.07; }

/* ── MAIN ── */
.main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 60px; }

/* ── HINT BAR ── */
.hint-bar {
display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
padding: 10px 16px; background: #f0faf2; border: 1px solid #d8f3dc;
border-radius: 10px; font-size: 0.78rem; color: #5a7a65; margin-top: 20px;
}
.hint-item { display: flex; align-items: center; gap: 6px; }
.hint-icon {
width: 24px; height: 24px; background: #d8f3dc;
border-radius: 6px; display: flex; align-items: center; justify-content: center;
font-size: 0.85rem; flex-shrink: 0;
}

/* ── DAYS GRID ── */
.days-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 14px;
}

/* ── DAY CARD ── */
.day-card {
background: #ffffff; border-radius: 16px;
border: 1.5px solid #d8f3dc; box-shadow: 0 1px 4px rgba(15,36,25,0.08);
overflow: hidden; display: flex; flex-direction: column;
transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s, opacity 0.2s;
position: relative;
animation: fadeUp 0.4s ease both;
user-select: none; -webkit-user-select: none;
}
.day-card:nth-child(1){animation-delay:.05s} .day-card:nth-child(2){animation-delay:.10s}
.day-card:nth-child(3){animation-delay:.15s} .day-card:nth-child(4){animation-delay:.20s}
.day-card:nth-child(5){animation-delay:.25s} .day-card:nth-child(6){animation-delay:.30s}
.day-card:nth-child(7){animation-delay:.35s}
@keyframes fadeUp {
from { opacity: 0; transform: translateY(12px); }
to   { opacity: 1; transform: translateY(0); }
}
.day-card:hover { box-shadow: 0 4px 20px rgba(15,36,25,0.12); transform: translateY(-2px); border-color: #74c69d; }
.day-card.today { border-color: #52b788; box-shadow: 0 0 0 3px rgba(82,183,136,0.15), 0 4px 20px rgba(15,36,25,0.12); }
.day-card.dragging { opacity: 0.4; transform: scale(0.97) !important; }
.day-card.drag-over { border-color: #52b788 !important; background: #f0faf2; transform: translateY(-4px) scale(1.02) !important; box-shadow: 0 12px 40px rgba(15,36,25,0.18) !important; }

.today-badge {
position: absolute; top: 9px; right: 9px;
background: #52b788; color: #ffffff;
font-size: 0.6rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
padding: 3px 9px; border-radius: 20px; z-index: 3; pointer-events: none;
}

/* ── DRAG HANDLE ──
touch-action:none is critical — tells the browser “don’t scroll on this element”
so touchmove fires reliably on Safari/iPad.
opacity is always 0.5 (visible), not hidden, so users know it exists. */
.drag-handle {
position: absolute; top: 9px; left: 9px;
width: 28px; height: 28px;
display: flex; flex-direction: column;
align-items: center; justify-content: center; gap: 4px;
cursor: grab; z-index: 10; border-radius: 6px;
background: rgba(45,106,79,0.1);
touch-action: none;
-webkit-touch-callout: none;
opacity: 0.45;
transition: opacity 0.2s, background 0.15s;
}
.drag-handle:hover { background: rgba(45,106,79,0.2); opacity: 1; cursor: grabbing; }
.drag-handle span {
display: block; width: 14px; height: 2px;
background: #245235; border-radius: 2px; pointer-events: none;
}

/* ── CARD HEAD ── */
.card-head {
background: linear-gradient(180deg, #f0faf2 0%, rgba(240,250,242,0) 100%);
padding: 12px 12px 10px 32px;
border-bottom: 1px solid #d8f3dc; flex-shrink: 0;
pointer-events: none;
}
.card-dayname {
font-family: ‘Playfair Display’, serif;
font-size: 1rem; color: #1a3a2a; line-height: 1;
}
.card-date { font-size: 0.72rem; color: #5a7a65; margin-top: 3px; }

/* ── IMAGE ── */
.card-img-wrap {
width: 100%; height: 120px;
position: relative; overflow: hidden; flex-shrink: 0; background: #f0faf2;
}
.card-img-wrap img {
width: 100%; height: 100%; object-fit: cover;
display: block; transition: transform 0.3s; pointer-events: none;
}
.day-card:hover .card-img-wrap img { transform: scale(1.04); }
.upload-overlay {
position: absolute; inset: 0; display: flex; flex-direction: column;
align-items: center; justify-content: center; gap: 5px;
background: #f0faf2; cursor: pointer; transition: background 0.2s;
}
.upload-overlay:hover { background: #d8f3dc; }
.upload-overlay .u-icon { font-size: 1.6rem; opacity: 0.4; pointer-events: none; }
.upload-overlay .u-text { font-size: 0.67rem; color: #5a7a65; pointer-events: none; }
.change-photo-btn {
position: absolute; inset: 0; background: rgba(15,36,25,0.55); color: #ffffff;
border: none; cursor: pointer;
font-family: ‘DM Sans’, sans-serif; font-size: 0.75rem; font-weight: 500;
display: flex; align-items: center; justify-content: center; gap: 6px;
opacity: 0; transition: opacity 0.2s;
}
.card-img-wrap:hover .change-photo-btn { opacity: 1; }
.file-input { display: none; }

/* ── CARD BODY ── */
.card-body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; }
.meal-input {
width: 100%; border: none; outline: none;
font-family: ‘DM Sans’, sans-serif; font-size: 0.85rem;
color: #1a2e22; background: transparent; resize: none; line-height: 1.45;
-webkit-user-drag: none; user-select: text; -webkit-user-select: text; cursor: text;
}
.meal-input::placeholder { color: #bbb; font-style: italic; }
.meal-input:focus {
background: #f0faf2; border-radius: 8px;
padding: 6px 8px; margin: -6px -8px; width: calc(100% + 16px);
}
.save-tick {
font-size: 0.65rem; color: #52b788; display: flex; align-items: center; gap: 4px;
margin-top: 6px; height: 14px; opacity: 0; transition: opacity 0.4s;
}
.save-tick.show { opacity: 1; }
.save-tick::before {
content: ‘’; width: 6px; height: 6px;
background: #52b788; border-radius: 50%; display: inline-block;
}

/* ── MOBILE ── */
@media (max-width: 860px) {
.days-grid { grid-template-columns: 1fr; gap: 16px; }
.day-card { flex-direction: row; min-height: 100px; }
.card-head {
width: 110px; flex-shrink: 0;
border-bottom: none; border-right: 1px solid #d8f3dc;
padding: 14px 10px 14px 36px;
display: flex; flex-direction: column; justify-content: center;
}
.drag-handle { top: 50%; transform: translateY(-50%); left: 8px; opacity: 0.6; }
.card-dayname { font-size: 0.95rem; }
.card-img-wrap { width: 100px; flex-shrink: 0; height: 100px; }
.card-body { padding: 10px 14px; justify-content: center; }
.today-badge { top: auto; bottom: 8px; right: 8px; }
.header-inner { flex-direction: column; gap: 12px; }
.site-title { font-size: 1.3rem; text-align: center; }
}

/* ── SPINNER ── */
.spinner {
position: absolute; inset: 0; background: rgba(255,255,255,0.85);
display: flex; align-items: center; justify-content: center; z-index: 10;
}
.spinner::after {
content: ‘’; width: 26px; height: 26px;
border: 3px solid #d8f3dc; border-top-color: #52b788;
border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── TOAST ── */
#toast {
position: fixed; bottom: 28px; left: 50%;
transform: translateX(-50%) translateY(20px);
background: #1a3a2a; color: #ffffff;
padding: 11px 22px; border-radius: 40px;
font-size: 0.82rem; font-weight: 500;
opacity: 0; pointer-events: none;
transition: opacity 0.3s, transform 0.3s; z-index: 9999; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── TOUCH GHOST (floating card while dragging on iPad) ── */
.touch-ghost {
position: fixed; pointer-events: none; z-index: 9998; opacity: 0.9;
border-radius: 16px; box-shadow: 0 20px 60px rgba(15,36,25,0.4);
transform: rotate(2deg) scale(1.05);
background: linear-gradient(135deg, #245235, #40916c);
display: flex; align-items: center; justify-content: center;
color: #ffffff; font-family: ‘Playfair Display’, serif;
font-size: 1.1rem; text-align: center; padding: 12px;
}
</style>

</head>
<body>

<header class="header">
  <svg class="leaf-deco" style="bottom:-20px;left:60px;width:120px;" viewBox="0 0 100 120" fill="none">
    <path d="M50 110 Q30 80 20 50 Q15 30 35 20 Q55 30 60 55 Q62 80 50 110Z" fill="#52b788"/>
    <path d="M50 110 Q68 75 72 48 Q78 28 58 18 Q40 28 38 55 Q38 80 50 110Z" fill="#95d5b2"/>
    <line x1="50" y1="110" x2="50" y2="20" stroke="#2d6a4f" stroke-width="1.5" opacity="0.4"/>
  </svg>
  <svg class="leaf-deco" style="top:-10px;right:180px;width:80px;transform:rotate(45deg);" viewBox="0 0 100 120" fill="none">
    <path d="M50 110 Q30 80 20 50 Q15 30 35 20 Q55 30 60 55 Q62 80 50 110Z" fill="#74c69d"/>
  </svg>
  <div class="header-inner">
    <button class="nav-btn" id="prevWeek">&#8592; Forrige uge</button>
    <div>
      <div class="site-title">Madplan for <em>familien Graff</em></div>
      <div class="week-meta" style="margin-top:6px;">
        <div class="week-num" id="weekNum">Uge &ndash;</div>
        <div class="week-range" id="weekRange">&ndash; til &ndash;</div>
      </div>
    </div>
    <button class="nav-btn" id="nextWeek">N&aelig;ste uge &#8594;</button>
  </div>
</header>

<main class="main">
  <div class="days-grid" id="daysGrid"></div>
  <div class="hint-bar">
    <div class="hint-item"><div class="hint-icon">&#8285;</div> Tr&aelig;k i h&aring;ndtaget for at bytte dage</div>
    <div class="hint-item"><div class="hint-icon">&#10003;</div> Tekst gemmes automatisk</div>
    <div class="hint-item"><div class="hint-icon">&#128247;</div> Klik p&aring; billedet for at skifte</div>
    <div class="hint-item"><div class="hint-icon">&#128241;</div> Virker p&aring; iPad og mobil</div>
  </div>
</main>

<div id="toast"></div>

<script>
'use strict';

// ── CONSTANTS ──
var DAYS   = ['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','L\u00f8rdag','S\u00f8ndag'];
var MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

// ── DATE HELPERS ──
function getMonday(d) {
  var dt = new Date(d);
  var day = dt.getDay();
  dt.setDate(dt.getDate() + (day === 0 ? -6 : 1 - day));
  dt.setHours(0, 0, 0, 0);
  return dt;
}
function getWeekNum(d) {
  var u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  u.setUTCDate(u.getUTCDate() + 4 - (u.getUTCDay() || 7));
  var y = new Date(Date.UTC(u.getUTCFullYear(), 0, 1));
  return Math.ceil((((u - y) / 86400000) + 1) / 7);
}
function fmtDate(d) { return d.getDate() + '. ' + MONTHS[d.getMonth()]; }
function isToday(d) {
  var t = new Date();
  return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
}
function weekDates(monday) {
  return Array.from({length: 7}, function(_, i) {
    var d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

// ── TOAST ──
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('show'); }, 2400);
}

// ── LOCAL STORAGE ──
function storageKey(m) { return 'madplan_' + m.toISOString().slice(0, 10); }
function loadData(m) {
  try {
    var raw = localStorage.getItem(storageKey(m));
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return DAYS.map(function(name) { return {name: name, meal: '', image: ''}; });
}
function saveData(m, data) {
  try { localStorage.setItem(storageKey(m), JSON.stringify(data)); } catch(e) {}
}

// ── STATE ──
var currentMonday = getMonday(new Date());
var weekData = loadData(currentMonday);

// ── RENDER HEADER ──
function renderHeader() {
  var sun = new Date(currentMonday);
  sun.setDate(currentMonday.getDate() + 6);
  document.getElementById('weekNum').textContent  = 'Uge ' + getWeekNum(currentMonday);
  document.getElementById('weekRange').textContent = fmtDate(currentMonday) + ' \u2013 ' + fmtDate(sun) + ' ' + sun.getFullYear();
}

// ── RENDER GRID ──
function renderGrid() {
  var grid = document.getElementById('daysGrid');
  var dd = weekDates(currentMonday);
  grid.innerHTML = '';

  weekData.forEach(function(day, idx) {
    var card = document.createElement('div');
    card.className = 'day-card' + (isToday(dd[idx]) ? ' today' : '');
    card.dataset.idx = String(idx);

    // Drag handle — 3 horizontal lines
    var handle = document.createElement('div');
    handle.className = 'drag-handle';
    handle.setAttribute('draggable', 'true');
    handle.dataset.idx = String(idx);
    handle.title = 'Tr\u00e6k for at bytte dag';
    handle.innerHTML = '<span></span><span></span><span></span>';
    card.appendChild(handle);

    // Today badge
    if (isToday(dd[idx])) {
      var badge = document.createElement('div');
      badge.className = 'today-badge';
      badge.textContent = 'I dag';
      card.appendChild(badge);
    }

    // Card head
    var head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = '<div class="card-dayname">' + day.name + '</div><div class="card-date">' + fmtDate(dd[idx]) + '</div>';
    card.appendChild(head);

    // Image wrap
    var iw = document.createElement('div');
    iw.className = 'card-img-wrap';
    iw.dataset.idx = String(idx);
    if (day.image) {
      iw.innerHTML =
        '<img src="' + day.image + '" alt="">' +
        '<button class="change-photo-btn" data-idx="' + idx + '">\uD83D\uDCF7 Skift billede</button>' +
        '<input type="file" class="file-input" accept="image/*" data-idx="' + idx + '">';
    } else {
      iw.innerHTML =
        '<div class="upload-overlay" data-idx="' + idx + '">' +
          '<div class="u-icon">\uD83C\uDF7D\uFE0F</div>' +
          '<div class="u-text">Klik for billede</div>' +
        '</div>' +
        '<input type="file" class="file-input" accept="image/*" data-idx="' + idx + '">';
    }
    card.appendChild(iw);

    // Card body
    var body = document.createElement('div');
    body.className = 'card-body';

    var ta = document.createElement('textarea');
    ta.className = 'meal-input';
    ta.dataset.idx = String(idx);
    ta.placeholder = 'Hvad spiser vi?';
    ta.rows = 2;
    ta.value = day.meal || '';
    // Stop propagation so typing doesn't trigger drag
    ta.addEventListener('mousedown', function(e) { e.stopPropagation(); });
    ta.addEventListener('touchstart', function(e) { e.stopPropagation(); }, {passive: true});
    body.appendChild(ta);

    var tick = document.createElement('div');
    tick.className = 'save-tick';
    tick.id = 'tick-' + idx;
    tick.textContent = 'Gemt';
    body.appendChild(tick);

    card.appendChild(body);
    grid.appendChild(card);
  });

  attachEvents();
}

function render() {
  renderHeader();
  renderGrid();
}

// ── DRAG & DROP ──
var dragSrcIdx  = null;
var touchGhost  = null;
var touchOffX   = 0;
var touchOffY   = 0;
var lastOverCard = null;

function doSwap(targetIdx) {
  if (dragSrcIdx === null || dragSrcIdx === targetIdx) {
    dragSrcIdx = null;
    return;
  }
  var srcName = weekData[dragSrcIdx].name;
  var tgtName = weekData[targetIdx].name;
  // Only swap meal and image — keep day names fixed in their positions
  var tmpMeal  = weekData[dragSrcIdx].meal;
  var tmpImage = weekData[dragSrcIdx].image;
  weekData[dragSrcIdx].meal  = weekData[targetIdx].meal;
  weekData[dragSrcIdx].image = weekData[targetIdx].image;
  weekData[targetIdx].meal   = tmpMeal;
  weekData[targetIdx].image  = tmpImage;
  saveData(currentMonday, weekData);
  toast(srcName + ' og ' + tgtName + ' byttet \u2713');
  dragSrcIdx = null;
  renderGrid();
}

function clearDragStyles() {
  document.querySelectorAll('.day-card').forEach(function(c) {
    c.classList.remove('dragging', 'drag-over');
  });
}

// Find card underneath touch point (hides ghost temporarily so it doesn't interfere)
function cardAtPoint(x, y) {
  if (touchGhost) touchGhost.style.visibility = 'hidden';
  var el = document.elementFromPoint(x, y);
  if (touchGhost) touchGhost.style.visibility = '';
  return el ? el.closest('.day-card') : null;
}

function attachEvents() {

  // ── Drag handles ──
  document.querySelectorAll('.drag-handle').forEach(function(handle) {

    // MOUSE: dragstart
    handle.addEventListener('dragstart', function(e) {
      dragSrcIdx = parseInt(handle.dataset.idx, 10);
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(dragSrcIdx));
      requestAnimationFrame(function() {
        handle.closest('.day-card').classList.add('dragging');
      });
    });

    handle.addEventListener('dragend', function() {
      clearDragStyles();
      dragSrcIdx = null;
    });

    // TOUCH: touchstart — passive (just records start position)
    handle.addEventListener('touchstart', function(e) {
      var t = e.touches[0];
      dragSrcIdx = parseInt(handle.dataset.idx, 10);
      var card = handle.closest('.day-card');
      var r = card.getBoundingClientRect();
      touchOffX = t.clientX - r.left;
      touchOffY = t.clientY - r.top;
      lastOverCard = null;
      card.classList.add('dragging');

      // Create ghost
      var g = document.createElement('div');
      g.className = 'touch-ghost';
      g.style.width  = r.width  + 'px';
      g.style.height = r.height + 'px';
      g.style.top    = r.top    + 'px';
      g.style.left   = r.left   + 'px';
      g.textContent  = card.querySelector('.card-dayname').textContent;
      document.body.appendChild(g);
      touchGhost = g;
    }, {passive: true});

    // TOUCH: touchmove — NON-passive so preventDefault stops page scroll.
    // This only works because touch-action:none is set on .drag-handle in CSS.
    handle.addEventListener('touchmove', function(e) {
      if (dragSrcIdx === null) return;
      e.preventDefault();

      var t = e.touches[0];
      touchGhost.style.left = (t.clientX - touchOffX) + 'px';
      touchGhost.style.top  = (t.clientY - touchOffY) + 'px';

      var over = cardAtPoint(t.clientX, t.clientY);
      if (over !== lastOverCard) {
        document.querySelectorAll('.day-card').forEach(function(c) { c.classList.remove('drag-over'); });
        if (over && parseInt(over.dataset.idx, 10) !== dragSrcIdx) {
          over.classList.add('drag-over');
        }
        lastOverCard = over;
      }
    }, {passive: false});

    // TOUCH: touchend
    handle.addEventListener('touchend', function(e) {
      if (dragSrcIdx === null) return;
      if (touchGhost) { touchGhost.remove(); touchGhost = null; }
      clearDragStyles();
      var t = e.changedTouches[0];
      var over = lastOverCard || cardAtPoint(t.clientX, t.clientY);
      if (over) {
        doSwap(parseInt(over.dataset.idx, 10));
      } else {
        dragSrcIdx = null;
      }
      lastOverCard = null;
    }, {passive: true});

    handle.addEventListener('touchcancel', function() {
      if (touchGhost) { touchGhost.remove(); touchGhost = null; }
      clearDragStyles();
      dragSrcIdx = null;
      lastOverCard = null;
    }, {passive: true});
  });

  // ── Mouse drop targets ──
  document.querySelectorAll('.day-card').forEach(function(card) {
    card.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (parseInt(card.dataset.idx, 10) !== dragSrcIdx) {
        card.classList.add('drag-over');
      }
    });
    card.addEventListener('dragleave', function(e) {
      if (!card.contains(e.relatedTarget)) card.classList.remove('drag-over');
    });
    card.addEventListener('drop', function(e) {
      e.preventDefault();
      card.classList.remove('drag-over');
      doSwap(parseInt(card.dataset.idx, 10));
    });
  });

  // ── Meal textarea auto-save ──
  document.querySelectorAll('.meal-input').forEach(function(el) {
    var timer;
    el.addEventListener('input', function() {
      var idx = parseInt(el.dataset.idx, 10);
      weekData[idx].meal = el.value;
      clearTimeout(timer);
      timer = setTimeout(function() {
        saveData(currentMonday, weekData);
        var tick = document.getElementById('tick-' + idx);
        if (tick) {
          tick.classList.add('show');
          setTimeout(function() { tick.classList.remove('show'); }, 2000);
        }
      }, 600);
    });
  });

  // ── Image upload ──
  document.querySelectorAll('.file-input').forEach(function(inp) {
    inp.addEventListener('change', function(e) { uploadImage(e, parseInt(inp.dataset.idx, 10)); });
  });
  document.querySelectorAll('.upload-overlay, .change-photo-btn').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      el.closest('.card-img-wrap').querySelector('.file-input').click();
    });
  });
}

// ── IMAGE UPLOAD (Cloudinary) ──
function uploadImage(e, idx) {
  var file = e.target.files[0];
  if (!file) return;

  var wrap = document.querySelectorAll('.card-img-wrap')[idx];
  var sp = document.createElement('div');
  sp.className = 'spinner';
  wrap.appendChild(sp);

  var fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', 'madplan_unsigned');
  fd.append('cloud_name', 'di5x780hh');

  fetch('https://api.cloudinary.com/v1_1/di5x780hh/image/upload', {method: 'POST', body: fd})
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.secure_url) {
        weekData[idx].image = data.secure_url;
        saveData(currentMonday, weekData);
        sp.remove();
        renderGrid();
        toast('Billede gemt \u2713');
      } else {
        sp.remove();
        toast('Fejl ved upload \u2013 pr\u00f8v igen');
      }
    })
    .catch(function() {
      sp.remove();
      toast('Fejl ved upload \u2013 pr\u00f8v igen');
    });
}

// ── WEEK NAVIGATION ──
document.getElementById('prevWeek').addEventListener('click', function() {
  currentMonday.setDate(currentMonday.getDate() - 7);
  weekData = loadData(currentMonday);
  render();
});
document.getElementById('nextWeek').addEventListener('click', function() {
  currentMonday.setDate(currentMonday.getDate() + 7);
  weekData = loadData(currentMonday);
  render();
});

// ── START ──
render();
</script>
